<html>
    <head>
            <title>Challenge: Write a poem</title>
            <meta charset="utf-8">
    </head>
    <body>
        <h1>
            Zhaña zhyl bizge kelip tür, <br>
            Qol bülgap bizge sälem berip tür, <br>
            Barlygy daiyndalad, seziled suyq yzgar, <br>
            Ärbir zhanüya mereke bastar. <br>
            Barimiz quanamyz, <br>
            Daiyndalad zhüldyzdar, <br>
            Ärbir kúnde olar shuagyn shashar.
        </h1>
    </body>
</html>
